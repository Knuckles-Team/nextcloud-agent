schema_version: '1'
connector: nextcloud-mcp
ontology_source: nextcloud
sync:
- preset: nextcloud-files
  server: nextcloud-mcp
  tool: nextcloud_list_files
  records_path: ''
  id_field: file_id
  title_field: name
  text_field: name
  updated_field: last_modified
  doc_type: file
governance:
  default_acl: quarantine
  identity: opaque-reference
  tenant: required-at-materialization
  provenance: required-at-materialization
